<meta charset="utf-8">
<title>NTUH phone</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F0EFEB" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#1C1C1A" media="(prefers-color-scheme:dark)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NTUH phone">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>

:root{
  --paper:#F0EFEB; --ink:#20252D; --muted:#675A59; --faint:#8D7770;
  --grid:#BBC1BE; --hair:#CAD0CC; --sunk:#E4E2DC; --accent:#74465E;
  --l0:#20252D; --l1:#4B3646; --l2:#75485F; --l3:#86696B;
  --l4:#978A82; --l5:#A8ABA1; --l6:#B9CBC1;
  --onink:#DDE3DE; --onink2:rgba(221,227,222,.55); --scrim:rgba(32,37,45,.32);
  --lg-rim:0 0 6px rgba(0,0,0,.03),0 2px 6px rgba(0,0,0,.08),inset 3px 3px .5px -3px rgba(0,0,0,.9),inset -3px -3px .5px -3px rgba(0,0,0,.85),inset 1px 1px 1px -.5px rgba(0,0,0,.6),inset -1px -1px 1px -.5px rgba(0,0,0,.6),inset 0 0 6px 6px rgba(0,0,0,.12),inset 0 0 2px 2px rgba(0,0,0,.06),0 0 12px rgba(255,255,255,.15);
  --lg-tint:rgba(255,255,255,.24);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1C1C1A; --ink:#DDE3DE; --muted:#9DA2A2; --faint:#777C7E;
    --grid:#3E4349; --hair:#31363D; --sunk:#26251F; --accent:#A38D98;
    --l0:#DDE3DE; --l1:#BBCFC5; --l2:#AEB7AD; --l3:#A19E95;
    --l4:#94857D; --l5:#876C6C; --l6:#7B5363;
    --onink:#20252D; --onink2:rgba(32,37,45,.55); --scrim:rgba(0,0,0,.58);
    --lg-rim:0 0 8px rgba(0,0,0,.03),0 2px 6px rgba(0,0,0,.08),inset 3px 3px .5px -3.5px rgba(255,255,255,.09),inset -3px -3px .5px -3.5px rgba(255,255,255,.85),inset 1px 1px 1px -.5px rgba(255,255,255,.6),inset -1px -1px 1px -.5px rgba(255,255,255,.6),inset 0 0 6px 6px rgba(255,255,255,.12),inset 0 0 2px 2px rgba(255,255,255,.06),0 0 12px rgba(0,0,0,.15);
    --lg-tint:rgba(255,255,255,.06);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1C1C1A; --ink:#DDE3DE; --muted:#9DA2A2; --faint:#777C7E;
  --grid:#3E4349; --hair:#31363D; --sunk:#26251F; --accent:#A38D98;
  --l0:#DDE3DE; --l1:#BBCFC5; --l2:#AEB7AD; --l3:#A19E95;
  --l4:#94857D; --l5:#876C6C; --l6:#7B5363;
  --onink:#20252D; --onink2:rgba(32,37,45,.55); --scrim:rgba(0,0,0,.58);
  --lg-rim:0 0 8px rgba(0,0,0,.03),0 2px 6px rgba(0,0,0,.08),inset 3px 3px .5px -3.5px rgba(255,255,255,.09),inset -3px -3px .5px -3.5px rgba(255,255,255,.85),inset 1px 1px 1px -.5px rgba(255,255,255,.6),inset -1px -1px 1px -.5px rgba(255,255,255,.6),inset 0 0 6px 6px rgba(255,255,255,.12),inset 0 0 2px 2px rgba(255,255,255,.06),0 0 12px rgba(0,0,0,.15);
  --lg-tint:rgba(255,255,255,.06);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:'Inter','Noto Sans TC',-apple-system,BlinkMacSystemFont,'PingFang TC','Microsoft JhengHei',sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;caret-color:var(--ink)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
::selection{background:var(--accent);color:var(--paper)}
*{scrollbar-color:var(--grid) transparent;scrollbar-width:thin}
*::-webkit-scrollbar{height:6px;width:6px}
*::-webkit-scrollbar-thumb{background:var(--grid);border-radius:99px}
*::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit}

.wrap{max-width:780px;margin:0 auto;padding:0 20px calc(56px + env(safe-area-inset-bottom))}
@media(min-width:820px){.wrap{padding:0 32px 80px}}
.mast{padding:28px 0 14px}
h1{font-size:clamp(23px,6.2vw,30px);font-weight:700;letter-spacing:-.03em;margin:0;line-height:1.1}

.totop{position:fixed;z-index:60;width:50px;height:50px;padding:0;border:0;border-radius:50%;
  right:max(16px,calc(env(safe-area-inset-right) + 12px));
  bottom:calc(18px + env(safe-area-inset-bottom));
  background:none;color:var(--ink);cursor:pointer;isolation:isolate;-webkit-tap-highlight-color:transparent;
  opacity:0;pointer-events:none;transform:translateY(10px) scale(.86);
  transition:opacity .22s ease,transform .28s cubic-bezier(.2,.8,.2,1)}
.totop.show{opacity:1;pointer-events:auto;transform:none}
.totop>span{position:absolute;inset:0;border-radius:inherit;pointer-events:none}
.totop .lg-lens{z-index:-3;overflow:hidden;
  -webkit-backdrop-filter:blur(5px) saturate(1.8);backdrop-filter:blur(5px) saturate(1.8)}
.totop.refract .lg-lens{-webkit-backdrop-filter:none;backdrop-filter:url(#lgRefract) saturate(1.35)}
.totop .lg-tint{z-index:-2;background:var(--lg-tint)}
.totop .lg-spec{z-index:-1;background-size:100% 100%;mix-blend-mode:screen;opacity:.9}
.totop .lg-rim{z-index:1;box-shadow:var(--lg-rim)}
.totop svg{position:relative;z-index:2;display:block;margin:auto}
@media (hover:hover){.totop.show:hover{transform:scale(1.05)}}
.totop.show:active{transform:scale(.97)}
.totop:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.totop,.totop.show:hover,.totop.show:active{transition:opacity .15s;transform:none}}
.mastrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.appsw{flex:none}

.wrap.is-sched #bar,.wrap.is-sched #tally,.wrap.is-sched #crosshint,
.wrap.is-sched #dirPanel,.wrap.is-sched #opdPanel,.wrap.is-sched #orPanel,
.wrap.is-sched .notes{display:none!important}
.schtop{position:sticky;top:0;z-index:40;background:var(--paper);padding:10px 0 0;
  border-bottom:1px solid var(--grid)}
.schtop .groupbar{padding-bottom:8px}
.schtop .tabs{margin-top:2px}
.schsect{margin:22px 0 0}
.schhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 8px}
.schhead h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.02em}
.schhead .sub{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

.schnow{background:var(--sunk);border-radius:14px;padding:14px 14px 10px;margin:16px 0 0}
.schnow .when{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--accent);margin:0 0 6px}
.nrow{display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:4px 10px;
  padding:7px 0;border-top:1px solid var(--hair)}
.nrow:first-of-type{border-top:0}
.nrow .k{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.nrow .k small{display:block;font-size:9.5px;font-weight:500;color:var(--faint);letter-spacing:0}
.nrow .who{font-size:15.5px;font-weight:600;min-width:0}
.nrow .who small{font-size:11px;font-weight:500;color:var(--muted);margin-left:5px}
.nrow .none{color:var(--faint);font-weight:400;font-size:13px}
.nrow .pill{justify-self:end}
.nrow.live .k{color:var(--accent)}
.livetag{font-size:10px;font-weight:700;color:var(--accent);margin-left:7px;letter-spacing:.04em;white-space:nowrap}
.nm{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
@media (hover:hover){.nm:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}}

.sday{display:grid;grid-template-columns:40px 1fr;gap:0 10px;padding:10px 0;border-top:1px solid var(--hair)}
.sday.today{background:var(--sunk);border-radius:10px;border-top-color:transparent;padding:10px 8px;margin:0 -8px}
.sday.today+.sday{border-top-color:transparent}
.sdate{text-align:center;line-height:1.1}
.sdate b{display:block;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sdate i{font-style:normal;font-size:10.5px;color:var(--muted)}
.sday.wkend .sdate b{color:var(--accent)}
.sgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 8px;min-width:0}
.sgrid.r3{grid-template-columns:repeat(3,minmax(0,1fr))}
.sgrid+.sgrid{margin-top:6px}
.cell{min-width:0}
.cell .k{display:block;font-size:9.5px;font-weight:600;color:var(--faint);letter-spacing:.04em;white-space:nowrap}
.cell .v{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .v small{font-size:10px;font-weight:500;color:var(--muted);margin-left:2px}
.cell .v.none{color:var(--faint);font-weight:400}
.xtra{grid-column:1/-1;font-size:11.5px;color:var(--muted);margin-top:2px}
.xtra b{font-weight:600;color:var(--ink)}
.xtra i{font-style:normal;color:var(--faint);padding:0 4px}
.wkhead{font-size:9.5px;font-weight:600;letter-spacing:.1em;color:var(--muted);margin:18px 0 2px}

.srow{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:4px 10px;
  padding:10px 0;border-top:1px solid var(--hair)}
.srow .item{font-size:13.5px;color:var(--l1);min-width:0}
.srow .who{font-size:15px;font-weight:600;text-align:right}
.srow .snote{grid-column:1/-1;font-size:11.5px;color:var(--muted);margin-top:-2px}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 22px}
.rward h3{font-size:12px;font-weight:700;margin:14px 0 2px;letter-spacing:.02em}
.rrow{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;padding:5px 0;
  border-top:1px solid var(--hair)}
.rrow .lv{font-size:10px;font-weight:600;color:var(--faint)}
.rrow .who{font-size:14px;font-weight:600}

.ashift{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:6px 8px;padding:3px 0}
.ashift .t{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ashift .who{font-size:14px;font-weight:600;min-width:0}
.alab{font-size:9.5px;font-weight:600;letter-spacing:.08em;color:var(--faint);margin:4px 0 0}
.alab:first-child{margin-top:0}

.gotoday{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 0}
.gotoday .lab{font-size:9.5px;font-weight:600;letter-spacing:.1em;color:var(--muted)}
.todaybtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--grid);background:none;
  color:var(--ink);font:inherit;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:99px;cursor:pointer}
.todaybtn span{font-size:11px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.todaybtn svg{color:var(--muted)}
@media (hover:hover){.todaybtn:hover{border-color:var(--ink)}}
@media (pointer:coarse){.todaybtn{padding:8px 14px}}
.sday.flash{animation:dayflash 1.4s ease-out}
@keyframes dayflash{0%{box-shadow:inset 0 0 0 2px var(--accent)}100%{box-shadow:inset 0 0 0 2px transparent}}
@media (prefers-reduced-motion:reduce){.sday.flash{animation:none}}

.crtab{font-variant-numeric:tabular-nums}
.crr{display:grid;grid-template-columns:40px repeat(5,minmax(0,1fr));gap:0 6px;align-items:baseline;
  padding:7px 0;border-top:1px solid var(--hair)}
.crr.crh{border-top:0;padding:0 0 5px}
.crr.crh span{font-size:9.5px;font-weight:600;color:var(--faint);letter-spacing:.04em}
.crr.sel{background:var(--sunk);border-radius:10px;border-top-color:transparent;padding:7px 8px;margin:0 -8px}
.crr.sel+.crr{border-top-color:transparent}
.crr .crm{font-size:12px;font-weight:600;color:var(--l1)}
.crr .crm i{display:block;font-style:normal;font-size:9px;font-weight:600;color:var(--accent);letter-spacing:.04em}
.crr .v{font-size:13px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crr .v small{display:block;font-size:9.5px;font-weight:500;color:var(--muted)}
.crr .v.none{color:var(--faint);font-weight:400}
.schnote{font-size:11.5px;color:var(--muted);line-height:1.65;margin:14px 0 0}
.schempty{padding:30px 0;color:var(--muted);font-size:13px;text-align:center}
.schsrc{font-size:10px;letter-spacing:.08em;color:var(--faint);margin:26px 0 0;text-transform:uppercase}
.mastsub{margin:5px 0 0;font-size:12.5px;color:var(--muted);font-weight:400}
.mastsub b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.topbar{position:sticky;top:0;z-index:40;background:var(--paper);padding:10px 0 0;
  margin:0 -20px;padding-left:20px;padding-right:20px}
@media(min-width:820px){.topbar{margin:0 -32px;padding-left:32px;padding-right:32px}}
.topbar::after{content:"";display:block;height:1px;background:var(--grid);opacity:0;transition:opacity .18s}
.topbar.stuck::after{opacity:1}
.field{display:flex;align-items:center;gap:9px;background:var(--sunk);border-radius:12px;padding:0 12px}
.field svg{flex:none;color:var(--muted)}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);
  font:inherit;font-size:16px;padding:12px 0;-webkit-appearance:none}
.field input::placeholder{color:var(--muted);opacity:1}
.field input::-webkit-search-cancel-button{display:none}
.clear{flex:none;width:26px;height:26px;display:none;place-items:center;border:0;border-radius:99px;
  background:var(--ink);color:var(--paper);cursor:pointer;padding:0}
.field.has .clear{display:grid}

.tabrow{display:flex;align-items:center;gap:14px;margin-top:12px}
.tabs{display:flex;gap:20px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabrow .modes{flex:none;margin-bottom:9px}
.tabs button{border:0;background:none;padding:0 0 9px;cursor:pointer;color:var(--muted);
  font-size:14px;font-weight:500;letter-spacing:.01em;position:relative;display:flex;align-items:baseline;gap:6px;
  
  white-space:nowrap}
.tabs button .n{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--faint)}
.tabs button[aria-selected="true"]{color:var(--accent);font-weight:700}
.tabs button[aria-selected="true"] .n{color:var(--muted)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;
  height:2px;background:var(--accent)}
.tabs button[disabled]{opacity:.38;cursor:default}
.tabs button.none .n{opacity:.45}
.crumbs{display:flex;align-items:center;gap:2px;overflow-x:auto;padding:9px 0 8px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.crumbs::-webkit-scrollbar{display:none}
.crumbs button{flex:none;border:0;background:none;padding:3px 0;cursor:pointer;
  font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.crumbs button:nth-last-child(3){color:var(--l1)}
.crumbs .now{color:var(--ink);font-weight:700;cursor:default}
.crumbs .sep{flex:none;color:var(--faint);font-size:12px;padding:0 5px;user-select:none}
.crumbs .up{margin-right:9px;display:inline-flex;align-items:center;gap:4px;color:var(--ink);font-weight:600}

.tally{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--faint);
  margin:9px 0 12px;text-transform:uppercase;font-variant-numeric:tabular-nums}
.tally:empty{display:none}
.lvhead{padding:20px 0 12px}
.lvhead h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.lvhead .sub{margin:3px 0 0;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.lvhead .sub i{font-style:normal;color:var(--faint);padding:0 5px}
.secthead{font-size:9.5px;font-weight:600;letter-spacing:.1em;color:var(--muted);
  text-transform:uppercase;margin:20px 0 2px;padding-bottom:5px;border-bottom:1px solid var(--grid)}
.secthead:first-child{margin-top:0}
.groups{display:block}
.grow{display:grid;grid-template-columns:1fr auto auto;grid-template-areas:"name num chev" "bar bar bar" "leg leg leg";
  align-items:baseline;gap:0 10px;width:100%;text-align:left;border:0;background:none;
  padding:11px 0 12px;border-bottom:1px solid var(--grid);cursor:pointer}
.grow:last-child{border-bottom:0}
.gname{grid-area:name;font-size:15px;font-weight:600;letter-spacing:-.01em;min-width:0;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gname em{font-style:normal;color:var(--muted);font-weight:500;font-size:12.5px;margin-left:7px}
.gnum{grid-area:num;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  min-width:52px;text-align:right;line-height:1.3}
.chev{grid-area:chev;color:var(--faint);width:7px;display:flex;align-items:center;justify-content:flex-end}
.bar{grid-area:bar;display:flex;height:4px;margin-top:6px;border-radius:0 99px 99px 0;overflow:hidden;
  transform-origin:left center}
.bar i{display:block;height:100%}
.bar i+i{box-shadow:-1px 0 0 var(--paper)}
.leg{grid-area:leg;margin-top:5px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg b{font-weight:600;color:var(--l1)}
.leg s{text-decoration:none;color:var(--faint);padding:0 4px}
.grow:hover .gname,.grow:hover .gnum{color:var(--ink)}
@media (hover:hover){.grow:hover{background:var(--sunk);box-shadow:-12px 0 0 var(--sunk),12px 0 0 var(--sunk)}}
.people{display:block}
@media(min-width:820px){.people{display:grid;grid-template-columns:1fr 1fr;column-gap:30px}}
.prow{display:grid;grid-template-columns:38px 1fr;gap:0 9px;padding:9px 0 10px;align-items:baseline;
  border-bottom:1px solid var(--hair)}
.gut{font-size:10px;font-weight:600;letter-spacing:.04em;color:var(--l1);line-height:1.3;
  font-variant-numeric:tabular-nums;text-align:right;overflow:hidden;text-overflow:ellipsis}
.gut.site{color:var(--faint)}
.pline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;line-height:1.3}
.pname{font-size:15.5px;font-weight:600;letter-spacing:.01em}
.twho{margin-left:auto;font-size:13px;font-weight:600;color:var(--l1)}
.emp{border:0;background:none;padding:0;cursor:pointer;font-size:11px;font-weight:500;margin-left:auto;
  color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.emp:hover{color:var(--ink)}
.pmeta{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:1px}
.pmeta i{font-style:normal;color:var(--faint);padding:0 4px}
.pmeta .alt{color:var(--faint);margin-left:9px}

.pmeta .wish{color:var(--faint);margin-left:9px}
.pmeta .wish.lead{margin-left:0}
.pnums{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}

.pill{display:inline-flex;align-items:baseline;gap:6px;text-decoration:none;border-radius:7px;
  padding:4px 9px;border:1px solid var(--grid);color:var(--ink);background:none;cursor:pointer;
  line-height:1.2}
.pill .k{font-size:9.5px;font-weight:600;letter-spacing:.06em;color:var(--muted);flex:none}
.pill .v{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pill .v i{font-style:normal;color:var(--faint)}
.pill.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.pill.mail .v{font-size:11.5px;font-variant-numeric:normal;letter-spacing:0;font-weight:600}
.pill.on .k{color:var(--onink2)}

// 一次 PBKDF2 得到這個人的 KEK；密碼多組也只跑這一次
async function deriveKek(pass){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: ub64(VAULT.s), iterations: VAULT.n, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, true, ['decrypt']);
}
// 拿 KEK 去試每一個信封，開得了哪個就是誰的；開不了代表密碼不對
async function cekFrom(kek){
  for (const w of VAULT.w) {
    try {
      const raw = await crypto.subtle.decrypt({ name:'AES-GCM', iv: ub64(w.i) }, kek, ub64(w.c));
      return await crypto.subtle.importKey('raw', raw, { name:'AES-GCM' }, false, ['decrypt']);
    } catch {}
  }
  return null;
}
async function openVault(cek){
  const packed = await crypto.subtle.decrypt({ name:'AES-GCM', iv: ub64(VAULT.i) }, cek, ub64(VAULT.c));
  if (typeof DecompressionStream !== 'function')
    throw new Error('這個瀏覽器太舊，不支援 DecompressionStream');
  const ds = new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(ds).text());
}
function reveal(v){
  const app = $g('#app');
  app.innerHTML = v.b;
  app.hidden = false;
  $g('#gate').remove();
  if (v.t) document.title = v.t;
  new Function('DOCTORS', 'DIRDATA', 'OR_DATA', 'PEOPLE_EXTRA', 'WARD_TEAM', 'WARD_DOCS', 'ROBOT', 'SUBSP', 'SCHEDULES', v.j)(v.d, v.x, v.o || {sessions:[],notes:[]}, v.e || {people:{}}, v.w || {wards:{}}, v.wd || {wards:{}}, v.r || null, v.s || {people:{}}, v.sc || null);
}
async function unlockWith(kek){
  const cek = await cekFrom(kek);
  if (!cek) throw new Error('BADCODE');
  reveal(await openVault(cek));
}
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEYSTORE); } catch {}
  if (saved) {
    try {
      await unlockWith(await crypto.subtle.importKey('raw', ub64(saved), { name:'AES-GCM' }, true, ['decrypt']));
      return;
    } catch { try { localStorage.removeItem(KEYSTORE); } catch {} }
  }
  const form = $g('#lockForm'), btn = $g('#unlock'), msg = $g('#msg'), pw = $g('#pw');
  // 只收數字；滿六碼就自己送出，不必再按解鎖
  pw.addEventListener('input', () => {
    const v = pw.value.replace(/\D/g, '').slice(0, 6);
    if (v !== pw.value) pw.value = v;
    if (v.length === 6 && !btn.disabled) form.requestSubmit();
  });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const pass = pw.value.replace(/\D/g, '');
    if (pass.length !== 6) { msg.className = 'msg'; msg.textContent = '請輸入六位數字'; return; }
    btn.disabled = true; msg.className = 'msg'; msg.textContent = '解鎖中…';
    try {
      const kek = await deriveKek(pass);
      const cek = await cekFrom(kek);
      if (!cek) throw new Error('BADCODE');
      const v = await openVault(cek);
      if ($g('#remember').checked) {
        try { localStorage.setItem(KEYSTORE, b64(await crypto.subtle.exportKey('raw', kek))); } catch {}
      }
      reveal(v);
    } catch (err) {
      msg.className = 'msg bad';
      msg.textContent = String(err.message||'').includes('DecompressionStream')
        ? err.message : '密碼不對';
      btn.disabled = false;
      pw.value = ''; pw.focus();
    }
  });
  pw.focus();
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
