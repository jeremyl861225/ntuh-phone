<meta charset="utf-8">
<title>NTUH phone</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#EEEEEE" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#0C1211" media="(prefers-color-scheme:dark)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NTUH phone">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
:root{
  --bg:#EFF3F1; --surface:#FFFFFF; --surface2:#F4F8F6; --sunken:#E6ECE9;
  --ink:#131C19; --ink2:#35443E; --muted:#5F706A;
  --line:#D9E3DE; --hair:#E8EFEB;
  --accent:#0B6857; --accent2:#084B3F; --wash:#DDEDE7;
  --flag:#84500A; --flagwash:#F7EAD6;
  --pm:#33527C; --pmwash:#E2E9F3;
  --sh1:0 1px 1px rgba(19,28,25,.04),0 2px 6px -2px rgba(19,28,25,.10);
  --sh2:0 2px 4px rgba(19,28,25,.05),0 14px 30px -16px rgba(19,28,25,.32);
  --ring:0 0 0 3px rgba(11,104,87,.22);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1211; --surface:#141D1A; --surface2:#18231F; --sunken:#101816;
    --ink:#E7EFEB; --ink2:#C2D0CA; --muted:#8DA098;
    --line:#243330; --hair:#1C2825;
    --accent:#5AC9AB; --accent2:#8BE0C7; --wash:#123029;
    --flag:#E3B166; --flagwash:#302510;
    --pm:#9AB8DF; --pmwash:#172230;
    --sh1:0 1px 1px rgba(0,0,0,.5),0 2px 8px -3px rgba(0,0,0,.6);
    --sh2:0 2px 6px rgba(0,0,0,.55),0 18px 34px -20px rgba(0,0,0,.9);
    --ring:0 0 0 3px rgba(90,201,171,.28);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1211; --surface:#141D1A; --surface2:#18231F; --sunken:#101816;
  --ink:#E7EFEB; --ink2:#C2D0CA; --muted:#8DA098;
  --line:#243330; --hair:#1C2825;
  --accent:#5AC9AB; --accent2:#8BE0C7; --wash:#123029;
  --flag:#E3B166; --flagwash:#302510;
  --pm:#9AB8DF; --pmwash:#172230;
  --sh1:0 1px 1px rgba(0,0,0,.5),0 2px 8px -3px rgba(0,0,0,.6);
  --sh2:0 2px 6px rgba(0,0,0,.55),0 18px 34px -20px rgba(0,0,0,.9);
  --ring:0 0 0 3px rgba(90,201,171,.28);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  caret-color:var(--accent);
}
::selection{background:var(--wash);color:var(--accent2)}
*{scrollbar-color:var(--line) transparent;scrollbar-width:thin}
*::-webkit-scrollbar{height:8px;width:8px}
*::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
*::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace;font-variant-numeric:tabular-nums}

.shell{max-width:1000px;margin:0 auto;padding:0 16px calc(48px + env(safe-area-inset-bottom))}
@media(min-width:760px){.shell{padding:0 28px 72px}}
.mast{padding:30px 0 16px}
@media(min-width:760px){.mast{padding:46px 0 22px}}
h1{font-family:"Noto Serif TC",serif;font-weight:700;font-size:clamp(27px,7.4vw,40px);
  line-height:1.15;letter-spacing:.01em;margin:0 0 12px;text-wrap:balance}
.facts{display:flex;flex-wrap:wrap;gap:6px 0;list-style:none;margin:0;padding:0;
  font-size:13px;color:var(--muted)}
.facts li{padding-right:11px;margin-right:11px;border-right:1px solid var(--line)}
.facts li:last-child{border-right:0;margin-right:0;padding-right:0}
.facts b{color:var(--ink2);font-weight:500}
.bar{position:sticky;top:0;z-index:30;padding:10px 0 12px;
  background:linear-gradient(var(--bg) 72%,transparent);backdrop-filter:blur(8px)}
.field{display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:0 12px;box-shadow:var(--sh1);
  transition:box-shadow .15s,border-color .15s}
.field:focus-within{border-color:var(--accent);box-shadow:var(--ring)}
.field svg{flex:none;color:var(--muted)}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);
  font:inherit;font-size:16px;padding:13px 0;-webkit-appearance:none}
.field input::placeholder{color:var(--muted);opacity:1}
.field input::-webkit-search-cancel-button{display:none}
.clear{flex:none;width:34px;height:34px;display:none;place-items:center;border:0;border-radius:9px;
  background:var(--sunken);color:var(--muted);cursor:pointer;padding:0}
.field.has .clear{display:grid}
.rowline{display:flex;gap:8px;margin-top:9px;align-items:stretch}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;flex:1;background:var(--sunken);
  border-radius:12px;padding:3px}
.days button{border:0;background:transparent;color:var(--ink2);font:inherit;font-size:13.5px;
  padding:9px 0;border-radius:9px;cursor:pointer;min-height:40px;transition:background .13s,color .13s}
.days button[aria-pressed="true"]{background:var(--surface);color:var(--accent2);font-weight:700;box-shadow:var(--sh1)}
.modes{display:flex;background:var(--sunken);border-radius:12px;padding:3px;gap:3px;flex:none}
.modes button{border:0;background:transparent;color:var(--ink2);font:inherit;font-size:13.5px;
  padding:9px 13px;border-radius:9px;cursor:pointer;min-height:40px;white-space:nowrap}
.modes button[aria-pressed="true"]{background:var(--surface);color:var(--accent2);font-weight:700;box-shadow:var(--sh1)}
.scroller{position:relative;margin-top:9px}
.specs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch}
.specs::-webkit-scrollbar{display:none}
.specs{scrollbar-width:none}
.specs button{flex:none;scroll-snap-align:start;border:1px solid var(--line);background:var(--surface);
  color:var(--ink2);font:inherit;font-size:13px;padding:7px 13px;border-radius:999px;cursor:pointer;
  min-height:36px;white-space:nowrap;transition:border-color .13s,background .13s,color .13s}
.specs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:500}
:root[data-theme="dark"] .specs button[aria-pressed="true"]{color:#0C1211}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .specs button[aria-pressed="true"]{color:#0C1211}}
.specs .n{font-size:11px;opacity:.62;margin-left:5px;font-family:"IBM Plex Mono",monospace}
.tally{font-size:12.5px;color:var(--muted);margin:11px 2px 0;font-family:"IBM Plex Mono",monospace}
@media (pointer:coarse){
  .specs button{min-height:40px;padding:9px 15px}
  .days button,.modes button{min-height:44px}
}
.cards{display:grid;gap:11px}
@media(min-width:760px){.cards{grid-template-columns:1fr 1fr;gap:13px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--sh1);overflow:hidden}
.card > .top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:14px 15px 0}
.name{font-family:"Noto Serif TC",serif;font-weight:600;font-size:20px;letter-spacing:.04em;margin:0}
.ids{display:flex;gap:6px;margin-left:auto}
.idbtn{display:inline-flex;align-items:baseline;gap:5px;border:1px solid var(--hair);background:var(--surface2);
  color:var(--ink2);border-radius:9px;padding:4px 9px;font:inherit;font-size:12.5px;cursor:pointer;
  min-height:32px;align-items:center;transition:border-color .13s,background .13s}
.idbtn:hover{border-color:var(--accent)}
.idbtn .lab{font-size:10.5px;color:var(--muted);letter-spacing:.08em}
.idbtn .val{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
.idbtn[disabled]{opacity:.5;cursor:default}
@media (pointer:coarse){.idbtn{min-height:38px}}
.tagrow{display:flex;flex-wrap:wrap;gap:5px;padding:9px 15px 0}
.pill{font-size:11.5px;line-height:1.6;color:var(--accent2);background:var(--wash);border-radius:6px;padding:2px 8px}
.sessions{display:flex;flex-direction:column;margin-top:11px;border-top:1px solid var(--hair)}
.ses{display:grid;grid-template-columns:64px 1fr;gap:11px;padding:10px 15px;border-bottom:1px solid var(--hair)}
.ses:last-child{border-bottom:0}
.slotwhen{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.wd{font-size:13px;font-weight:500;letter-spacing:.02em}
.hf{font-size:10.5px;font-weight:600;letter-spacing:.1em;padding:1px 6px;border-radius:5px}
.hf.am{color:var(--accent2);background:var(--wash)}
.hf.pm{color:var(--pm);background:var(--pmwash)}
.room{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.code{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);margin-left:7px}
.flags{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:7px}
.flag{font-size:11px;padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.flag.warn{color:var(--flag);background:var(--flagwash);border-color:transparent;font-weight:500}
.flag.week{color:var(--accent2);background:var(--wash);border-color:transparent;font-weight:500}
.sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.sub i{font-style:normal;opacity:.42;margin:0 5px}
.empty{grid-column:1/-1;padding:44px 8px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink2);font-weight:500;margin-bottom:5px;font-size:16px}
.weekwrap{display:flex;flex-direction:column;gap:11px}
.daygroup{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh1);overflow:hidden}
.daygroup > h2{margin:0;padding:12px 15px;font-size:14px;font-weight:700;letter-spacing:.06em;
  background:var(--surface2);border-bottom:1px solid var(--hair);font-family:"Noto Sans TC",sans-serif}
.halfblock{padding:11px 15px;border-bottom:1px solid var(--hair)}
.halfblock:last-child{border-bottom:0}
.halfblock > h3{margin:0 0 7px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:var(--muted)}
.wrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px;padding:4px 0}
.wrow .wn{font-family:"Noto Serif TC",serif;font-weight:600;font-size:15px;letter-spacing:.03em}
.wrow .wr{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted)}
.wrow .ws{font-size:12.5px;color:var(--muted)}
.wrow.dim{opacity:.34}
table.grid{border-collapse:collapse;width:100%;table-layout:fixed}
.gridwrap{display:none}
@media(min-width:900px){
  .weekwrap{display:none}
  .gridwrap{display:block;background:var(--surface);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--sh1);overflow:hidden}
  table.grid th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:11px 12px;
    border-bottom:1px solid var(--line);background:var(--surface2);letter-spacing:.06em}
  table.grid th.rh{width:58px}
  table.grid td{vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--hair);border-left:1px solid var(--hair)}
  table.grid tr:last-child td{border-bottom:0}
  table.grid td.rh{border-left:0;background:var(--surface2);font-size:11px;color:var(--muted);letter-spacing:.1em;font-weight:600}
}
.notes{margin-top:38px;border-top:1px solid var(--line);padding-top:26px}
.notes section{margin-bottom:24px;max-width:68ch}
.notes h2{font-family:"Noto Serif TC",serif;font-size:17px;font-weight:600;margin:0 0 9px;letter-spacing:.02em}
.notes p{margin:0 0 9px;font-size:13.5px;color:var(--muted);line-height:1.75}
.notes p:last-child{margin-bottom:0}
.notes b{color:var(--ink2);font-weight:500}
.notes a{color:var(--accent2);text-decoration:underline;text-underline-offset:3px;
  text-decoration-color:color-mix(in srgb,var(--accent) 45%,transparent)}
dl.key{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;margin:0;font-size:13.5px}
dl.key dt{margin:0}
dl.key dd{margin:0;color:var(--muted);font-size:13px;align-self:center}
.tel{display:inline-flex;align-items:center;gap:7px;margin-top:4px;font-family:"IBM Plex Mono",monospace;
  font-size:13px;color:var(--accent2);text-decoration:none;border:1px solid var(--line);
  background:var(--surface);border-radius:10px;padding:8px 12px;min-height:40px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
  background:var(--ink);color:var(--bg);font-size:13.5px;padding:9px 16px;border-radius:11px;
  box-shadow:var(--sh2);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:60;
  font-family:"IBM Plex Mono",monospace}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:no-preference){
  .card,.daygroup{animation:rise .42s cubic-bezier(.16,.84,.44,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
}
</style>
<style>

.card > .top{align-items:flex-start;gap:8px 10px}
.who{display:flex;flex-direction:column;gap:2px;min-width:0}
.who .meta{font-size:11.5px;color:var(--muted);line-height:1.45}
.who .meta em{font-style:normal;color:var(--ink2)}
.ids{display:flex;flex-wrap:wrap;gap:5px;margin-left:auto;justify-content:flex-end}
.tagrow{gap:5px}
.pill.tag2{color:var(--ink2);background:var(--surface2);border:1px solid var(--hair)}
.pill.tag2 s{text-decoration:none;color:var(--muted);font-size:10px;margin-left:3px}
.sub .loc{color:var(--ink2)}
.groupbar{display:flex;gap:6px;overflow-x:auto;margin-top:9px;padding-bottom:2px;scrollbar-width:none}
.groupbar::-webkit-scrollbar{display:none}
.groupbar button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink2);
  font:inherit;font-size:13px;padding:7px 13px;border-radius:999px;cursor:pointer;min-height:36px;white-space:nowrap}
.groupbar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:500}
:root[data-theme="dark"] .groupbar button[aria-pressed="true"]{color:#0C1211}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .groupbar button[aria-pressed="true"]{color:#0C1211}}
.groupbar .n{font-size:11px;opacity:.62;margin-left:5px;font-family:"IBM Plex Mono",monospace}
@media (pointer:coarse){.groupbar button{min-height:40px;padding:9px 15px}}
.ses{grid-template-columns:60px 1fr}
@media(min-width:420px){.ses{grid-template-columns:64px 1fr}}
.privacy{border:1px solid var(--flag);background:var(--flagwash);border-radius:12px;padding:12px 14px;
  margin:16px 0 0;font-size:13px;color:var(--flag)}
.privacy b{color:var(--flag);font-weight:700}
</style>
<style>

.switch{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;margin-top:9px;
  background:var(--sunken);border-radius:13px;padding:3px}
.switch button{border:0;background:transparent;color:var(--ink2);font:inherit;font-size:14px;
  padding:10px 6px;border-radius:10px;cursor:pointer;min-height:44px;display:flex;
  align-items:center;justify-content:center;gap:7px;
  transition:background .15s cubic-bezier(.16,.84,.44,1),color .15s}
.switch button[aria-selected="true"]{background:var(--surface);color:var(--accent2);font-weight:700;box-shadow:var(--sh1)}
.switch .n{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:500;
  color:var(--muted);font-variant-numeric:tabular-nums}
.switch button[aria-selected="true"] .n{color:var(--accent)}
.switch button.none .n{opacity:.4}

.crosshint{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:11px;padding:11px 13px;
  background:var(--surface2);border:1px solid var(--hair);border-radius:12px;font-size:13px;color:var(--muted)}
.crosshint b{color:var(--ink2);font-weight:500}
.crosshint button{margin-left:auto;border:1px solid var(--accent);background:transparent;color:var(--accent2);
  font:inherit;font-size:13px;font-weight:500;padding:7px 13px;border-radius:9px;cursor:pointer;min-height:38px;
  white-space:nowrap;transition:background .13s,color .13s}
.crosshint button:hover{background:var(--accent);color:var(--surface)}
:root[data-theme="dark"] .crosshint button:hover{color:#0C1211}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .crosshint button:hover{color:#0C1211}}
.dirlist{display:grid;gap:8px}
@media(min-width:760px){.dirlist{grid-template-columns:1fr 1fr;gap:10px}}
.drow{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--sh1);padding:12px 14px}
.drow .dtop{display:flex;align-items:baseline;gap:5px 9px;flex-wrap:wrap}
.dname{font-family:"Noto Serif TC",serif;font-weight:600;font-size:17.5px;letter-spacing:.03em;margin:0;
  line-height:1.35}
.dname .ab{font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:600;color:var(--accent);
  letter-spacing:.02em;margin-right:2px}
.dname .rk{font-family:"IBM Plex Mono",monospace;font-size:13.5px;font-weight:600;color:var(--muted);
  letter-spacing:.02em;margin-right:4px}
.djob{font-size:11.5px;color:var(--muted);line-height:1.5}
.dmeta{display:flex;align-items:center;gap:6px 9px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:3px}
.dmeta i{font-style:normal;opacity:.4}
.demp{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink2);
  border:1px solid var(--hair);border-radius:6px;padding:1px 6px;font-variant-numeric:tabular-nums;
  background:var(--surface2);cursor:pointer}
.demp:hover{border-color:var(--accent)}
.dnums{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.numchip{display:inline-flex;align-items:center;gap:6px;text-decoration:none;
  border:1px solid var(--hair);background:var(--surface2);color:var(--ink2);border-radius:9px;
  padding:5px 10px;min-height:36px;transition:border-color .13s,background .13s}
.numchip:hover{border-color:var(--accent);background:var(--wash)}
.numchip .lab{font-size:10.5px;color:var(--muted);letter-spacing:.08em;flex:none}
.numchip .val{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  font-weight:600;font-size:13.5px;letter-spacing:.01em}
.numchip.mob .val{color:var(--accent2)}
@media (pointer:coarse){.numchip{min-height:42px;padding:7px 12px}.demp{padding:3px 8px}}
.dnote{font-size:12px;color:var(--muted);margin-top:7px;white-space:pre-wrap;line-height:1.6}
.opdlink{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--accent);color:var(--accent2);
  background:transparent;border-radius:9px;padding:5px 10px;min-height:36px;font:inherit;font-size:12.5px;
  font-weight:500;cursor:pointer;transition:background .13s,color .13s}
.opdlink:hover{background:var(--accent);color:var(--surface)}
:root[data-theme="dark"] .opdlink:hover{color:#0C1211}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .opdlink:hover{color:#0C1211}}
@media (pointer:coarse){.opdlink{min-height:42px}}

.dirhead{display:flex;align-items:baseline;gap:9px;margin:18px 2px 9px;flex-wrap:wrap}
.dirhead:first-child{margin-top:2px}
.dirhead h2{font-family:"Noto Serif TC",serif;font-size:15px;font-weight:600;margin:0;letter-spacing:.03em}
.dirhead .n{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted)}
.more{display:block;width:100%;margin-top:12px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink2);font:inherit;font-size:13.5px;padding:12px;border-radius:12px;cursor:pointer;min-height:46px}
.more:hover{border-color:var(--accent);color:var(--accent2)}
@media (prefers-reduced-motion:no-preference){

<style>
.gate{min-height:100dvh;display:grid;place-items:center;padding:24px}
.lock{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);
  border-radius:18px;box-shadow:var(--sh2);padding:28px 24px 24px;text-align:center}
.lock img{width:64px;height:64px;border-radius:15px;display:block;margin:0 auto 16px}
.lock h1{font-family:"Noto Serif TC",serif;font-size:21px;font-weight:600;margin:0 0 6px;letter-spacing:.04em}
.lock p{font-size:13px;color:var(--muted);margin:0 0 20px;line-height:1.6}
.lock label{display:block;text-align:left;font-size:12px;color:var(--muted);margin:0 0 6px;letter-spacing:.04em}
.lock input[type=password]{width:100%;padding:13px 14px;font-size:16px;border:1px solid var(--line);
  border-radius:12px;background:var(--surface2);color:var(--ink);font-family:"IBM Plex Mono",monospace;
  letter-spacing:.06em;-webkit-appearance:none}
.lock input[type=password]:focus{outline:0;border-color:var(--accent);box-shadow:var(--ring)}
.lock button{width:100%;margin-top:14px;padding:14px;font:inherit;font-size:15px;font-weight:600;
  border:0;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer;min-height:50px}
.lock button:disabled{opacity:.55;cursor:default}
:root[data-theme="dark"] .lock button{color:#0C1211}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lock button{color:#0C1211}}
.lock .remember{display:flex;align-items:center;gap:8px;justify-content:flex-start;margin-top:14px;
  font-size:13px;color:var(--muted)}
.lock .remember input{width:17px;height:17px;accent-color:var(--accent)}
.lock .msg{margin:14px 0 0;font-size:13px;min-height:1.2em}
.lock .msg.bad{color:var(--flag)}
.lock .foot{margin:18px 0 0;font-size:11.5px;color:var(--muted);line-height:1.6}
</style>

    <input id="pw" type="password" inputmode="text" autocomplete="current-password"
           enterkeyhint="go" placeholder="xxxx-xxxx-xxxx-xxxx-xxxx" spellcheck="false">
    <label class="remember"><input type="checkbox" id="remember" checked>記住這台裝置</label>
    <button type="submit" id="unlock">解鎖</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
    <p class="foot">AES-GCM 256 加密，金鑰由通行碼經 PBKDF2-SHA256 導出。<br>
      通行碼不會離開這台裝置，也沒有存在伺服器上。</p>
  </form>
</div>

const KEYSTORE = 'ntuh-phone-key';
const ub64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64  = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const $g = s => document.querySelector(s);

async function deriveKey(pass){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: ub64(VAULT.s), iterations: VAULT.n, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, true, ['decrypt']);
}
async function openVault(key){
  const packed = await crypto.subtle.decrypt({ name:'AES-GCM', iv: ub64(VAULT.i) }, key, ub64(VAULT.c));
  if (typeof DecompressionStream !== 'function')
    throw new Error('這個瀏覽器太舊，不支援 DecompressionStream');
  const ds = new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(ds).text());
}
function reveal(v){
  const app = $g('#app');
  app.innerHTML = v.b;
  app.hidden = false;
  $g('#gate').remove();
  if (v.t) document.title = v.t;
  new Function('DOCTORS', 'DIRDATA', v.j)(v.d, v.x);
}
async function tryKeyRaw(raw){
  const key = await crypto.subtle.importKey('raw', ub64(raw), { name:'AES-GCM' }, true, ['decrypt']);
  reveal(await openVault(key));
}
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEYSTORE); } catch {}
  if (saved) { try { await tryKeyRaw(saved); return; } catch { try{ localStorage.removeItem(KEYSTORE); }catch{} } }
  $g('#lockForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $g('#unlock'), msg = $g('#msg');
    const pass = $g('#pw').value.trim();
    if (!pass) return;
    btn.disabled = true; msg.className = 'msg'; msg.textContent = '解鎖中…';
    try {
      const key = await deriveKey(pass);
      const v = await openVault(key);
      if ($g('#remember').checked) {
        try { localStorage.setItem(KEYSTORE, b64(await crypto.subtle.exportKey('raw', key))); } catch {}
      }
      reveal(v);
    } catch (err) {
      msg.className = 'msg bad';
      msg.textContent = String(err.message||'').includes('DecompressionStream')
        ? err.message : '通行碼不對';
      btn.disabled = false;
      $g('#pw').select();
    }
  });
  $g('#pw').focus();
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
