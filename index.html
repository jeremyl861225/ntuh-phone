<meta charset="utf-8">
<title>NTUH phone</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F0EFEB" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#1C1C1A" media="(prefers-color-scheme:dark)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NTUH phone">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>

:root{
  --paper:#F0EFEB; --ink:#20252D; --muted:#675A59; --faint:#8D7770;
  --grid:#BBC1BE; --hair:#CAD0CC; --sunk:#E4E2DC; --accent:#74465E;
  --l0:#20252D; --l1:#4B3646; --l2:#75485F; --l3:#86696B;
  --l4:#978A82; --l5:#A8ABA1; --l6:#B9CBC1;
  --onink:#DDE3DE; --onink2:rgba(221,227,222,.55);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1C1C1A; --ink:#DDE3DE; --muted:#9DA2A2; --faint:#777C7E;
    --grid:#3E4349; --hair:#31363D; --sunk:#26251F; --accent:#A38D98;
    --l0:#DDE3DE; --l1:#BBCFC5; --l2:#AEB7AD; --l3:#A19E95;
    --l4:#94857D; --l5:#876C6C; --l6:#7B5363;
    --onink:#20252D; --onink2:rgba(32,37,45,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1C1C1A; --ink:#DDE3DE; --muted:#9DA2A2; --faint:#777C7E;
  --grid:#3E4349; --hair:#31363D; --sunk:#26251F; --accent:#A38D98;
  --l0:#DDE3DE; --l1:#BBCFC5; --l2:#AEB7AD; --l3:#A19E95;
  --l4:#94857D; --l5:#876C6C; --l6:#7B5363;
  --onink:#20252D; --onink2:rgba(32,37,45,.55);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:'Inter','Noto Sans TC',-apple-system,BlinkMacSystemFont,'PingFang TC','Microsoft JhengHei',sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;caret-color:var(--ink)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
::selection{background:var(--accent);color:var(--paper)}
*{scrollbar-color:var(--grid) transparent;scrollbar-width:thin}
*::-webkit-scrollbar{height:6px;width:6px}
*::-webkit-scrollbar-thumb{background:var(--grid);border-radius:99px}
*::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit}

.wrap{max-width:780px;margin:0 auto;padding:0 20px calc(56px + env(safe-area-inset-bottom))}
@media(min-width:820px){.wrap{padding:0 32px 80px}}
.mast{padding:28px 0 14px}
h1{font-size:clamp(23px,6.2vw,30px);font-weight:700;letter-spacing:-.03em;margin:0;line-height:1.1}
.mastsub{margin:5px 0 0;font-size:12.5px;color:var(--muted);font-weight:400}
.mastsub b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.topbar{position:sticky;top:0;z-index:40;background:var(--paper);padding:10px 0 0;
  margin:0 -20px;padding-left:20px;padding-right:20px}
@media(min-width:820px){.topbar{margin:0 -32px;padding-left:32px;padding-right:32px}}
.topbar::after{content:"";display:block;height:1px;background:var(--grid);opacity:0;transition:opacity .18s}
.topbar.stuck::after{opacity:1}
.field{display:flex;align-items:center;gap:9px;background:var(--sunk);border-radius:12px;padding:0 12px}
.field svg{flex:none;color:var(--muted)}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);
  font:inherit;font-size:16px;padding:12px 0;-webkit-appearance:none}
.field input::placeholder{color:var(--muted);opacity:1}
.field input::-webkit-search-cancel-button{display:none}
.clear{flex:none;width:26px;height:26px;display:none;place-items:center;border:0;border-radius:99px;
  background:var(--ink);color:var(--paper);cursor:pointer;padding:0}
.field.has .clear{display:grid}

.tabrow{display:flex;align-items:center;gap:14px;margin-top:12px}
.tabs{display:flex;gap:20px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabrow .modes{flex:none;margin-bottom:9px}
.tabs button{border:0;background:none;padding:0 0 9px;cursor:pointer;color:var(--muted);
  font-size:14px;font-weight:500;letter-spacing:.01em;position:relative;display:flex;align-items:baseline;gap:6px}
.tabs button .n{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--faint)}
.tabs button[aria-selected="true"]{color:var(--accent);font-weight:700}
.tabs button[aria-selected="true"] .n{color:var(--muted)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;
  height:2px;background:var(--accent)}
.tabs button[disabled]{opacity:.38;cursor:default}
.tabs button.none .n{opacity:.45}
.crumbs{display:flex;align-items:center;gap:2px;overflow-x:auto;padding:9px 0 8px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.crumbs::-webkit-scrollbar{display:none}
.crumbs button{flex:none;border:0;background:none;padding:3px 0;cursor:pointer;
  font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.crumbs button:nth-last-child(3){color:var(--l1)}
.crumbs .now{color:var(--ink);font-weight:700;cursor:default}
.crumbs .sep{flex:none;color:var(--faint);font-size:12px;padding:0 5px;user-select:none}
.crumbs .up{margin-right:9px;display:inline-flex;align-items:center;gap:4px;color:var(--ink);font-weight:600}

.tally{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--faint);
  margin:0 0 12px;text-transform:uppercase;font-variant-numeric:tabular-nums}
.lvhead{padding:20px 0 12px}
.lvhead h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.lvhead .sub{margin:3px 0 0;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.lvhead .sub i{font-style:normal;color:var(--faint);padding:0 5px}
.secthead{font-size:9.5px;font-weight:600;letter-spacing:.1em;color:var(--muted);
  text-transform:uppercase;margin:20px 0 2px;padding-bottom:5px;border-bottom:1px solid var(--grid)}
.secthead:first-child{margin-top:0}
.groups{display:block}
.grow{display:grid;grid-template-columns:1fr auto auto;grid-template-areas:"name num chev" "bar bar bar" "leg leg leg";
  align-items:baseline;gap:0 10px;width:100%;text-align:left;border:0;background:none;
  padding:11px 0 12px;border-bottom:1px solid var(--grid);cursor:pointer}
.grow:last-child{border-bottom:0}
.gname{grid-area:name;font-size:15px;font-weight:600;letter-spacing:-.01em;min-width:0;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gname em{font-style:normal;color:var(--muted);font-weight:500;font-size:12.5px;margin-left:7px}
.gnum{grid-area:num;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  min-width:52px;text-align:right;line-height:1.3}
.chev{grid-area:chev;color:var(--faint);width:7px;display:flex;align-items:center;justify-content:flex-end}
.bar{grid-area:bar;display:flex;height:4px;margin-top:6px;border-radius:0 99px 99px 0;overflow:hidden;
  transform-origin:left center}
.bar i{display:block;height:100%}
.bar i+i{box-shadow:-1px 0 0 var(--paper)}
.leg{grid-area:leg;margin-top:5px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg b{font-weight:600;color:var(--l1)}
.leg s{text-decoration:none;color:var(--faint);padding:0 4px}
.grow:hover .gname,.grow:hover .gnum{color:var(--ink)}
@media (hover:hover){.grow:hover{background:var(--sunk);box-shadow:-12px 0 0 var(--sunk),12px 0 0 var(--sunk)}}
.people{display:block}
@media(min-width:820px){.people{display:grid;grid-template-columns:1fr 1fr;column-gap:30px}}
.prow{display:grid;grid-template-columns:38px 1fr;gap:0 9px;padding:9px 0 10px;align-items:baseline;
  border-bottom:1px solid var(--hair)}
.gut{font-size:10px;font-weight:600;letter-spacing:.04em;color:var(--l1);line-height:1.3;
  font-variant-numeric:tabular-nums;text-align:right;overflow:hidden;text-overflow:ellipsis}
.gut.site{color:var(--faint)}
.pline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;line-height:1.3}
.pname{font-size:15.5px;font-weight:600;letter-spacing:.01em}
.twho{margin-left:auto;font-size:13px;font-weight:600;color:var(--l1)}
.emp{border:0;background:none;padding:0;cursor:pointer;font-size:11px;font-weight:500;margin-left:auto;
  color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.emp:hover{color:var(--ink)}
.pmeta{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:1px}
.pmeta i{font-style:normal;color:var(--faint);padding:0 4px}
.pmeta .alt{color:var(--faint);margin-left:9px}
.pnums{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}

.pill{display:inline-flex;align-items:baseline;gap:6px;text-decoration:none;border-radius:7px;
  padding:4px 9px;border:1px solid var(--grid);color:var(--ink);background:none;cursor:pointer;
  line-height:1.2}
.pill .k{font-size:9.5px;font-weight:600;letter-spacing:.06em;color:var(--muted);flex:none}
.pill .v{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pill .v i{font-style:normal;color:var(--faint)}
.pill.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.pill.mail .v{font-size:11.5px;font-variant-numeric:normal;letter-spacing:0;font-weight:600}
.pill.on .k{color:var(--onink2)}
.pill.on .v i{color:var(--onink2)}
@media (hover:hover){.pill:hover{border-color:var(--ink)}}
@media (pointer:coarse){.pill{padding:6px 11px}}
.pnote{font-size:11px;color:var(--muted);margin:6px 0 0;white-space:pre-wrap;line-height:1.55}
.opdlink{border:1px solid var(--grid);border-radius:7px;padding:4px 9px;background:none;
  font-size:11.5px;font-weight:600;cursor:pointer;color:var(--l2);line-height:1.2}
.opdlink:hover{border-color:var(--ink);color:var(--ink)}

.more{display:block;width:100%;margin-top:16px;border:1px solid var(--grid);background:none;
  color:var(--l2);font-size:12.5px;font-weight:600;padding:13px;border-radius:10px;cursor:pointer}
.more:hover{border-color:var(--ink);color:var(--ink)}
.sortbar{display:flex;align-items:center;gap:14px;padding:0 0 6px;font-size:11px;color:var(--faint);
  font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.sortbar button{border:0;background:none;padding:0;cursor:pointer;color:var(--faint);
  font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.sortbar button[aria-pressed="true"]{color:var(--accent)}

.empty{padding:52px 0;text-align:center;color:var(--muted);font-size:13px}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:6px;font-size:15px}
.crosshint{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px;
  padding:11px 0;border-top:1px solid var(--grid);border-bottom:1px solid var(--grid);
  font-size:12.5px;color:var(--muted)}
.crosshint b{color:var(--ink);font-weight:600}
.crosshint button{margin-left:auto;border:0;background:var(--accent);color:var(--paper);
  font-size:12px;font-weight:600;padding:6px 11px;border-radius:7px;cursor:pointer;white-space:nowrap}
.cards{display:grid;gap:0}

.card{border-bottom:1px solid var(--l5);padding:0 0 15px}
.card+.card{padding-top:15px}
.card .prow{border-bottom:0;padding-bottom:4px}
.tagrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag2{border:1px solid var(--grid);border-radius:6px;padding:1px 7px;font-size:11px;color:var(--l2);
  font-weight:500;line-height:1.5}
.tag2 s{text-decoration:none;color:var(--faint);margin-left:3px;font-size:10px}

.sessions{margin-top:0;padding-left:47px}
.ses{display:grid;grid-template-columns:26px 1fr;gap:0 8px;padding:6px 0;align-items:baseline;
  border-top:1px solid var(--hair)}
.wd{font-size:11.5px;font-weight:600;color:var(--l1);line-height:1.35;
  font-variant-numeric:tabular-nums}
.hf{font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--muted);margin-right:7px}
.hf.pm{color:var(--l3)}
.room{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.35}
.room i{font-style:normal;font-size:11.5px;font-weight:500;color:var(--muted);margin-left:6px}
.room b{font-weight:700}
.room br+b{display:inline-block;margin-top:2px}

.ar{font-style:normal;font-size:10px;font-weight:600;color:var(--muted);margin-right:5px;
  letter-spacing:.02em;font-variant-numeric:normal}
.code{font-size:11px;color:var(--faint);margin-left:6px;font-variant-numeric:tabular-nums}
.flags{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:6px}
.flag{font-size:10px;font-weight:600;letter-spacing:.02em;color:var(--muted);border:1px solid var(--grid);
  border-radius:4px;padding:0 5px;white-space:nowrap}
.flag.warn{color:var(--paper);background:var(--ink);border-color:var(--ink)}
.flag.week{color:var(--l1);border-color:var(--l4)}
.sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.sub i{font-style:normal;color:var(--faint);padding:0 4px}
.sub .loc{color:var(--l2)}
.modes{display:flex;gap:3px;background:var(--sunk);border-radius:10px;padding:3px;flex:none}
.modes button{border:0;background:none;font-size:12.5px;font-weight:500;color:var(--l2);
  padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.modes button[aria-pressed="true"]{background:var(--paper);color:var(--accent);font-weight:700}
.rowline{display:flex;gap:12px;align-items:center;margin-bottom:9px}
.rowline:empty{display:none}
.rowline .groupbar{padding-bottom:0;min-width:0}
.groupbar{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.groupbar::-webkit-scrollbar{display:none}
.groupbar{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);
  mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.groupbar button{flex:none;border:0;background:none;padding:0;cursor:pointer;font-size:12.5px;
  font-weight:500;color:var(--muted);white-space:nowrap}
.groupbar button[aria-pressed="true"]{color:var(--accent);font-weight:700}
.groupbar .n{font-size:10px;font-weight:600;color:var(--faint);margin-left:4px;font-variant-numeric:tabular-nums}

.weekwrap{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(212px,1fr);
  overflow-x:auto;scroll-snap-type:x proximity;overscroll-behavior-x:contain;scrollbar-width:none}
.weekwrap::-webkit-scrollbar{display:none}
.daygroup{scroll-snap-align:start;padding:0 13px 16px;border-right:1px solid var(--grid);min-width:0}
.daygroup:first-child{padding-left:0}
.daygroup:last-child{border-right:0;padding-right:0}
.daygroup>h2{position:sticky;top:0;z-index:1;background:var(--paper);margin:0 0 6px;
  font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--muted);
  padding:0 0 6px;border-bottom:1px solid var(--grid)}
.halfblock{padding:6px 0 0}
.halfblock>h3{margin:0 0 3px;font-size:9.5px;font-weight:600;letter-spacing:.1em;color:var(--faint)}
@media(min-width:1100px){
  #weekView,#orWeekView{width:100vw;margin-left:calc(50% - 50vw);padding:0 40px}
}
.wrow{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:3px 0;font-size:12.5px;
  border-top:1px solid var(--hair)}
.wrow:first-of-type{border-top:0}
.wrow .wn{font-weight:600;font-size:13px}
.wrow .wr{font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--muted);text-align:right;white-space:nowrap}
.wrow .ws{grid-column:1/-1;color:var(--muted);font-size:11px;line-height:1.45}

#orWeekwrap .wrow .ws{color:var(--ink);font-size:12px;font-weight:500}
#orWeekwrap .wrow .ws b{font-weight:600}
#orWeekwrap .wrow .ws br+b{display:inline-block;margin-top:2px}
#orWeekwrap .wrow .ws i{font-style:normal;font-weight:400;color:var(--muted);margin-left:6px;font-size:11px}
.wrow.dim{opacity:.32}
.dayempty{margin:0;font-size:11.5px;color:var(--faint)}
.notes{margin-top:26px}
.notes section{margin-bottom:20px;max-width:68ch}
.notes h2{font-size:13px;font-weight:700;margin:0 0 7px;letter-spacing:-.01em}
.notes p{margin:0 0 7px;font-size:12.5px;color:var(--muted);line-height:1.7}
.notes b{color:var(--ink);font-weight:600}
.notes a{color:var(--accent);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--accent)}
dl.key{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:12.5px}
dl.key dt{margin:0}
dl.key dd{margin:0;color:var(--muted);align-self:center}
.tel{display:inline-flex;align-items:center;gap:7px;margin-top:6px;font-size:12.5px;font-weight:600;
  font-variant-numeric:tabular-nums;color:var(--ink);text-decoration:none;border:1px solid var(--grid);
  border-radius:8px;padding:9px 13px}
.tel:hover{border-color:var(--ink)}
.src{font-size:9.5px;font-weight:600;letter-spacing:.08em;color:var(--faint);text-transform:uppercase;
  margin-top:26px;padding-top:14px;border-top:1px solid var(--grid)}
.privacy{border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:11px 0;margin:18px 0 0;
  font-size:12px;color:var(--ink)}
.privacy b{font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,12px);
  background:var(--ink);color:var(--paper);font-size:12.5px;font-weight:500;padding:9px 15px;border-radius:9px;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:60;font-variant-numeric:tabular-nums}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:no-preference){
  .lvl{animation:lvlin .34s cubic-bezier(.165,.84,.44,1)}
  @keyframes lvlin{from{opacity:0;transform:translateX(var(--dir,10px))}to{opacity:1;transform:none}}
  .bar{animation:grow .9s cubic-bezier(.165,.84,.44,1) both;animation-delay:calc(var(--k,0)*20ms)}
  @keyframes grow{from{transform:scaleX(0)}to{transform:none}}
}

a,button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{scroll-padding-top:140px}
.wrap{padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
@media(min-width:820px){.wrap{padding-left:max(32px,env(safe-area-inset-left));
  padding-right:max(32px,env(safe-area-inset-right))}}
.crumbs,.groupbar{overscroll-behavior-x:contain}

@media (pointer:coarse){
  
  .pill.on{padding:6px 12px}
  .pill.on .v{font-size:14.5px}
  .pill{padding:6px 11px}
  .opdlink,.idbtn{padding:6px 11px}
  
  .emp{padding:6px 8px;margin:-6px -8px -6px auto}
  .crumbs button{padding:11px 0}
  .crumbs .up{padding-right:9px}
  .sortbar button{padding:9px 0}
  .groupbar button{padding:9px 0}
  .tabs button{padding:8px 0 12px}
  .grow{padding:11px 0 12px}
  .days button,.modes button{padding:11px 10px}
}

.grow:active,.more:active{background:var(--sunk)}
.pill:active{border-color:var(--ink)}
.pill.on:active{opacity:.72}
.emp:active,.opdlink:active,.idbtn:active{color:var(--ink);border-color:var(--ink)}

@media(max-width:520px){
  .mast{padding:22px 0 10px}
  .topbar{padding-top:8px}
  .field input{padding:11px 0}
  .tabs{gap:18px;margin-top:10px}
  .crumbs{padding:6px 0 5px}

const KEYSTORE = 'ntuh-phone-key';
const ub64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64  = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const $g = s => document.querySelector(s);

async function deriveKey(pass){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: ub64(VAULT.s), iterations: VAULT.n, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, true, ['decrypt']);
}
async function openVault(key){
  const packed = await crypto.subtle.decrypt({ name:'AES-GCM', iv: ub64(VAULT.i) }, key, ub64(VAULT.c));
  if (typeof DecompressionStream !== 'function')
    throw new Error('這個瀏覽器太舊，不支援 DecompressionStream');
  const ds = new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(ds).text());
}
function reveal(v){
  const app = $g('#app');
  app.innerHTML = v.b;
  app.hidden = false;
  $g('#gate').remove();
  if (v.t) document.title = v.t;
  new Function('DOCTORS', 'DIRDATA', 'OR_DATA', 'PEOPLE_EXTRA', 'WARD_TEAM', v.j)(v.d, v.x, v.o || {sessions:[],notes:[]}, v.e || {people:{}}, v.w || {wards:{}});
}
async function tryKeyRaw(raw){
  const key = await crypto.subtle.importKey('raw', ub64(raw), { name:'AES-GCM' }, true, ['decrypt']);
  reveal(await openVault(key));
}
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEYSTORE); } catch {}
  if (saved) { try { await tryKeyRaw(saved); return; } catch { try{ localStorage.removeItem(KEYSTORE); }catch{} } }
  $g('#lockForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $g('#unlock'), msg = $g('#msg');
    const pass = $g('#pw').value.trim();
    if (!pass) return;
    btn.disabled = true; msg.className = 'msg'; msg.textContent = '解鎖中…';
    try {
      const key = await deriveKey(pass);
      const v = await openVault(key);
      if ($g('#remember').checked) {
        try { localStorage.setItem(KEYSTORE, b64(await crypto.subtle.exportKey('raw', key))); } catch {}
      }
      reveal(v);
    } catch (err) {
      msg.className = 'msg bad';
      msg.textContent = String(err.message||'').includes('DecompressionStream')
        ? err.message : '通行碼不對';
      btn.disabled = false;
      $g('#pw').select();
    }
  });
  $g('#pw').focus();
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
